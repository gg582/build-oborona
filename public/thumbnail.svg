<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Оборона</title>
  <desc id="desc">Punk poster thumbnail for 오보로나.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".05"/>
      <stop offset=".58" stop-color="#000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".82"/>
    </linearGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#12110f"/>
  <image href="thumbnail-art.png" width="1200" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="1200" fill="url(#shade)"/>
  <rect y="930" width="1200" height="270" fill="#0e0d0c" opacity=".78"/>
  <rect y="930" width="1200" height="8" fill="#20d6b5"/>
  <rect y="1012" width="1200" height="10" fill="#ff375f" opacity=".72"/>
  <g transform="translate(92 986) scale(2.1)">
    <rect x="58" y="13" width="170" height="18" fill="#ffc857"/>
    <rect x="208" y="0" width="32" height="50" fill="#ffc857"/>
    <rect x="0" y="62" width="70" height="72" fill="#ff375f"/>
    <rect x="42" y="38" width="68" height="102" fill="#ff375f"/>
    <rect x="98" y="78" width="126" height="8" fill="#f7f2e8"/>
    <rect x="98" y="104" width="114" height="8" fill="#f7f2e8"/>
  </g>
  <g transform="translate(936 972) scale(3.25)">
    <rect x="0" y="42" width="20" height="58" fill="#d8d0c4"/>
    <rect x="30" y="14" width="24" height="86" fill="#d8d0c4"/>
    <rect x="66" y="30" width="30" height="70" fill="#d8d0c4"/>
    <g fill="#20d6b5">
      <rect x="38" y="26" width="8" height="9"/>
      <rect x="38" y="48" width="8" height="9"/>
      <rect x="38" y="70" width="8" height="9"/>
      <rect x="74" y="44" width="10" height="9"/>
      <rect x="74" y="66" width="10" height="9"/>
      <rect x="6" y="56" width="8" height="9"/>
      <rect x="6" y="78" width="8" height="9"/>
    </g>
  </g>
  <text x="600" y="1040"
        text-anchor="middle"
        fill="#f7f2e8"
        stroke="#000"
        stroke-width="18"
        paint-order="stroke"
        font-family="Impact, Haettenschweiler, 'Arial Black', system-ui, sans-serif"
        font-size="176"
        font-weight="900"
        letter-spacing="0">Оборона</text>
  <text x="600" y="1112"
        text-anchor="middle"
        fill="#20d6b5"
        font-family="Arial, system-ui, sans-serif"
        font-size="38"
        font-weight="900"
        letter-spacing="0">ГРАЖДАНСКАЯ ОБОРОНА</text>
  <rect width="1200" height="1200" filter="url(#rough)"/>
</svg>
